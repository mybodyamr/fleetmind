name: ci
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Migration guard (self-test, then real migrations)
        run: |
          bash scripts/check-migrations.test.sh
          bash scripts/check-migrations.sh supabase/migrations
      - run: bash scripts/ci-annotate.sh 'supabase start' supabase start
      - run: bash scripts/ci-annotate.sh 'supabase db lint' supabase db lint
      - run: bash scripts/ci-annotate.sh 'supabase test db' supabase test db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
